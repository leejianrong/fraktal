[project]
name = "fraktal"
version = "0.0.1"
description = "Procedural world generation for synthetic satellite and geospatial training data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Rong Lee" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
fraktal = "fraktal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraktal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real files, subprocesses or network; excluded from the fast gate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]
