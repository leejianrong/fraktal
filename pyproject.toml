[project]
name = "fraktal"
version = "0.0.1"
description = "Procedural world generation for synthetic satellite and geospatial training data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Rong Lee" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "numba>=0.68.1",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
]

[project.scripts]
fraktal = "fraktal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
train = [
    "torch>=2.14.1",
]
seg = [  # eval-only class shares of street images (FRK-145)
    "torch>=2.14.1",
    "transformers>=4.50",
    "scipy>=1.11",
    "pillow>=10",  # the image processor of transformers needs it
]
report = [
    "matplotlib>=3.9",
    "pillow>=10",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraktal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs subprocesses, external services or network; excluded from the fast gate",
  "slow: takes several seconds (an end-to-end export or render); skipped by `make test-fast`",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["src/fraktal/blender_scene\\.py"]  # runs inside Blender; bpy has no stubs

[[tool.mypy.overrides]]
module = ["geopandas.*", "pyarrow.*", "shapely.*", "pandas.*", "rasterio.*", "torch.*", "matplotlib.*", "reportlab.*", "PIL.*", "trimesh.*", "transformers.*", "scipy.*"]
ignore_missing_imports = true

# torch 2.15's default Linux wheel is CUDA 13.2, whose runtime segfaults on WSL2 with the NVIDIA
# 595 driver (checked 2026-11-14). The CUDA 13.0 build of 2.14.1 works.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
