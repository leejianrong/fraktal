[project]
name = "fraktal"
version = "0.0.1"
description = "Procedural world generation for synthetic satellite and geospatial training data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Rong Lee" }]
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.1.4",
    "numba>=0.68.1",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
]

[project.scripts]
fraktal = "fraktal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
train = [
    "torch>=2.14.1",
]
report = [
    "matplotlib>=3.9",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraktal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs subprocesses, external services or network; excluded from the fast gate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pyarrow.*", "shapely.*", "pandas.*", "rasterio.*", "torch.*", "matplotlib.*", "reportlab.*", "PIL.*"]
ignore_missing_imports = true
